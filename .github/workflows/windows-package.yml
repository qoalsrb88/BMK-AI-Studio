name: Windows CPU package check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU build environment
        run: |
          python -m pip install -r requirements.txt -r requirements-ai.txt -r requirements-build.txt
          python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; assert torch.version.cuda is None"
      - name: Build isolated CPU executable
        env:
          BMK_BUILD_FOLDER: package-ci-cpu
          BMK_RELEASE_BUILD: '1'
        run: python build_windows.py
      - name: Frozen CPU compatibility and size
        run: |
          python scripts/probe_bundle.py package-ci-cpu/BMK-AI-Studio validation-ci-cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit_bundle.py package-ci-cpu/BMK-AI-Studio validation-ci-cpu/size.json
      - name: Diagnostic details
        if: always()
        run: |
          if (Test-Path validation-ci-cpu/diagnostic.json) { Get-Content validation-ci-cpu/diagnostic.json }
          if (Test-Path package-ci-cpu/build.log) { Get-Content package-ci-cpu/build.log -Tail 35 }

