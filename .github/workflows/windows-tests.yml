name: Windows source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check source boundary
        run: python scripts/check_repository.py --staged
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-ai.txt
          python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit and Qt regression suites
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/validate.py
