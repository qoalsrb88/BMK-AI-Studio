name: Windows source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check source boundary
        run: python scripts/check_repository.py --staged
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-ai.txt
          python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit and Qt regression suites
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/validate.py
